---
# AlphaClone System OS - On-Demand CI Entry
# Purpose: Allow maintainers to trigger full validation on demand.
# Author: AlphaClone Systems Core Team
# License: MIT
# TODO: Add matrix strategy for integration environments.

name: ci-run

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this manual run needed?"
        required: true
        default: "ad-hoc validation"

jobs:
  full-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run build workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build.yml
          token: ${{ secrets.GITHUB_TOKEN }}
